<style>
@property --h{syntax:'<number>';inherits:true;initial-value:268}
@property --sm{syntax:'<number>';inherits:true;initial-value:1}
:root{--sm:1;transition:--h .8s cubic-bezier(.4,0,.2,1),--sm .8s cubic-bezier(.4,0,.2,1)}
:root.nofade{transition:none}
:root{--h:268;--ac:hsl(var(--h) calc(38% * var(--sm)) 66%);--ink:#f2eff6;--dim:rgba(242,239,246,.55);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--ink);overflow:hidden;
 background:#16131b}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{position:relative;z-index:1;--sw:230px;display:grid;grid-template-columns:var(--sw) 1fr;gap:18px;height:100%;padding:18px;min-width:700px;transition:grid-template-columns .5s cubic-bezier(.3,1,.4,1)}
.app.slim{--sw:88px}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
 background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--line);
 backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}
aside{border-radius:28px;padding:44px 12px 20px;display:flex;flex-direction:column;position:relative;z-index:5}
.rest{display:inline-block;overflow:hidden;max-width:140px;transition:max-width .4s cubic-bezier(.3,1,.4,1),opacity .2s}


/* logo */
.logo{position:absolute;z-index:6;top:12px;left:50%;width:44px;height:44px;margin-left:-22px;filter:drop-shadow(0 4px 10px rgba(20,8,50,.45));transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.logo .lgi{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
aside{padding-top:64px}
@media (max-height:620px){.logo{top:8px;left:50%;width:36px;height:36px;margin-left:-18px}aside{padding-top:52px}}
.logo:hover{transform:scale(1.06)}

/* animated background */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 50% at 14% 18%,hsl(var(--h) calc(28% * var(--sm)) 42%/.34),transparent 70%),radial-gradient(50% 60% at 92% 92%,hsl(var(--h) calc(22% * var(--sm)) 30%/.34),transparent 70%)}
.blob{position:absolute;border-radius:50%;will-change:translate,scale;display:none}
[data-bg=aurora] .blob{display:block}
.lay{position:absolute;display:none}
[data-bg=grid] .l-grid,[data-bg=stars] .l-stars,[data-bg=stars] .l-stars2,[data-bg=rays] .l-rays,[data-bg=pixels] .l-pix{display:block}
.l-grid{inset:0;background:linear-gradient(hsl(var(--h) calc(40% * var(--sm)) 72%/.17) 1px,transparent 1px) 0 0/52px 52px,linear-gradient(90deg,hsl(var(--h) calc(40% * var(--sm)) 72%/.17) 1px,transparent 1px) 0 0/52px 52px;
 -webkit-mask-image:radial-gradient(85% 85% at 50% 45%,#000 30%,transparent);mask-image:radial-gradient(85% 85% at 50% 45%,#000 30%,transparent);animation:gridmove 24s linear infinite}
@keyframes gridmove{to{background-position:52px 52px,52px 52px}}
.l-stars,.l-stars2{inset:0}
.l-stars{background-image:radial-gradient(2.2px 2.2px at 20px 30px,#fff,transparent),radial-gradient(1.6px 1.6px at 120px 80px,#fff,transparent),radial-gradient(2.4px 2.4px at 70px 120px,#cfe3ff,transparent),radial-gradient(1.6px 1.6px at 140px 20px,#fff,transparent);background-size:170px 150px;animation:tw 5s ease-in-out infinite alternate}
.l-stars2{background-image:radial-gradient(1.6px 1.6px at 50px 60px,#fff,transparent),radial-gradient(2.2px 2.2px at 150px 20px,#ffe8c8,transparent),radial-gradient(1.6px 1.6px at 100px 130px,#fff,transparent);background-size:210px 180px;animation:tw 7s ease-in-out -3s infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}
.l-rays{inset:-60%;background:conic-gradient(from 0deg at 50% 50%,transparent 0 6%,hsl(var(--h) calc(50% * var(--sm)) 66%/.14) 10%,transparent 15% 30%,hsl(var(--h) calc(50% * var(--sm)) 66%/.1) 35%,transparent 40% 58%,hsl(var(--h) calc(50% * var(--sm)) 66%/.12) 62%,transparent 68% 84%,hsl(var(--h) calc(50% * var(--sm)) 66%/.09) 88%,transparent 94%);animation:spin 120s linear infinite}
@keyframes spin{to{rotate:360deg}}
.l-pix{inset:0;background:conic-gradient(rgba(255,255,255,.025) 25%,transparent 0 50%,rgba(255,255,255,.025) 0 75%,transparent 0) 0 0/72px 72px,conic-gradient(hsl(var(--h) calc(45% * var(--sm)) 60%/.05) 25%,transparent 0 50%,hsl(var(--h) calc(45% * var(--sm)) 60%/.05) 0 75%,transparent 0) 36px 36px/72px 72px;animation:pixmove 50s linear infinite}
@keyframes pixmove{to{background-position:72px 72px,108px 108px}}
.nobg .bg *{animation:none!important}
.b1{width:70vmax;height:70vmax;left:-20vmax;top:-26vmax;background:radial-gradient(closest-side,hsl(var(--h) calc(30% * var(--sm)) 44%/.62),transparent);animation:d1 26s ease-in-out infinite alternate}
.b2{width:60vmax;height:60vmax;right:-22vmax;bottom:-28vmax;background:radial-gradient(closest-side,hsl(calc(var(--h) + 24) calc(26% * var(--sm)) 32%/.6),transparent);animation:d2 32s ease-in-out infinite alternate}
.b3{width:38vmax;height:38vmax;left:38%;top:30%;background:radial-gradient(closest-side,hsl(calc(var(--h) - 28) calc(30% * var(--sm)) 38%/.34),transparent);animation:d3 40s ease-in-out infinite alternate}
@keyframes d1{to{translate:18vmax 14vmax;scale:1.15}}
@keyframes d2{to{translate:-20vmax -12vmax;scale:1.2}}
@keyframes d3{50%{translate:-14vmax 10vmax;scale:1.3}to{translate:10vmax -12vmax;scale:.9}}
.nobg .blob{animation:none}

/* nav + liquid lens */
nav{position:relative;display:flex;flex-direction:column;gap:14px;touch-action:none;user-select:none}
nav>button{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;height:56px;padding:0;border-radius:18px;color:var(--dim);font-weight:600;transition:color .25s}
.ic{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lb{margin-left:12px;overflow:hidden;white-space:nowrap;max-width:140px;transition:max-width .4s cubic-bezier(.3,1,.4,1),margin .4s,opacity .2s}
.slim .lb,.slim .rest,.slim #accLabel{max-width:0;opacity:0}
.slim .lb,.slim #accLabel{margin-left:0}
nav>button.on{color:hsl(var(--h) calc(85% * var(--sm)) 80%)}
.sopen-side nav>button[data-tab].on{color:var(--dim)}
nav>button:hover,#accBtn:hover{color:var(--ink)}
nav>button.on:hover{color:hsl(var(--h) calc(85% * var(--sm)) 80%)}
.ic{stroke-width:1.7}
.head,.edge{display:none}
.drop{position:relative;isolation:isolate;color:var(--ink)}
.drop,.lens,.gl{
 background:radial-gradient(120% 170% at 26% 4%,hsl(var(--h) calc(75% * var(--sm)) 80%/.26),hsl(var(--h) calc(60% * var(--sm)) 62%/.05) 62%),rgba(255,255,255,.04);
 backdrop-filter:saturate(1.8) brightness(1.18);-webkit-backdrop-filter:saturate(1.8) brightness(1.18);
 box-shadow:none}
.drop::after,.lens::after,.gl::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 box-shadow:inset 1px 1px 2px -1px rgba(255,255,255,.28),inset -1px -1px 2px -1px rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.1),inset 0 0 10px rgba(255,255,255,.03)}
.gl{position:absolute;left:0;top:0;z-index:3;pointer-events:none;transition:translate .42s cubic-bezier(.3,1.08,.45,1),width .3s,height .3s,opacity .4s ease}
.lens{position:absolute;z-index:3;left:0;right:0;top:0;border-radius:18px;pointer-events:none;
 transition:translate .42s cubic-bezier(.3,1.08,.45,1),height .3s,filter .2s}
.lens.held{filter:brightness(1.08)}

/* account */
.acc{position:relative;margin-top:auto}
.logout{margin-top:12px;display:grid;place-items:center;width:56px;height:56px;margin-inline:auto;border-radius:18px;color:var(--dim);transition:color .2s}
.logout:hover{color:var(--ink)}
#accBtn{width:56px;height:56px;margin:0 auto;display:grid;place-items:center;padding:0;border-radius:18px;border:0;color:var(--ink);transition:filter .2s,transform .18s ease-out}
#accBtn .av,#accBtn #accLabel{display:none}
#accBtn:hover{filter:brightness(1.08)}
#accBtn:active{transform:scale(.985)}
.av{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--ac),hsl(var(--h) calc(30% * var(--sm)) 30%));flex:none}
#accLabel{flex:1;margin-left:10px;max-width:200px;transition:max-width .4s cubic-bezier(.3,1,.4,1),margin .4s,opacity .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
#accLabel small{color:var(--dim);margin-left:6px}
.pop{position:absolute;left:0;right:0;bottom:calc(100% + 8px);border-radius:18px;padding:8px;background:rgba(30,26,38,.88);
 border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 18px 40px -10px rgba(0,0,0,.6);
 transform-origin:bottom left;opacity:0;scale:.92;translate:0 8px;pointer-events:none;
 transition:opacity .18s,scale .28s cubic-bezier(.3,1.3,.5,1),translate .28s cubic-bezier(.3,1.3,.5,1)}
.pop.open{opacity:1;scale:1;translate:0 0;pointer-events:auto}
.pop .row{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:11px;text-align:left;font-size:13px}
.pop .row:hover{background:rgba(255,255,255,.08)}
.pop .row i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--dim);flex:none}
.pop .row.sel i{background:var(--ac);border-color:var(--ac)}
.pop .row em{font-style:normal;color:var(--dim);margin-left:auto;font-size:12px}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.add{display:flex;gap:6px;padding:2px 4px}

 color:var(--dim);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s}

/* iOS-style soft gradient wallpapers */
.bg::before{display:none}
.ios{position:absolute;inset:-10%;filter:blur(70px) saturate(1.05);opacity:.72;transform:translateZ(0)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,9,20,.22),rgba(12,9,20,.42))}
.ios i{position:absolute;border-radius:50%;will-change:translate,scale;display:block}
.o1{width:62vmax;height:62vmax;left:-14vmax;top:-18vmax;background:var(--c1);animation:io1 24s ease-in-out infinite alternate}
.o2{width:58vmax;height:58vmax;right:-16vmax;top:6vmax;background:var(--c2);animation:io2 30s ease-in-out infinite alternate}
.o3{width:66vmax;height:66vmax;left:8vmax;bottom:-30vmax;background:var(--c3);animation:io3 36s ease-in-out infinite alternate}
.o4{width:40vmax;height:40vmax;left:42%;top:24%;background:var(--c4);opacity:.75;animation:io4 28s ease-in-out infinite alternate}
@keyframes io1{to{translate:14vmax 10vmax;scale:1.12}}
@keyframes io2{to{translate:-16vmax 12vmax;scale:1.15}}
@keyframes io3{to{translate:12vmax -10vmax;scale:1.1}}
@keyframes io4{50%{translate:-12vmax 8vmax;scale:1.25}to{translate:10vmax -9vmax;scale:.9}}
.nobg .ios i{animation:none}
:root{--c0:#14101c;--c1:hsl(var(--h) calc(70% * var(--sm)) 52%);--c2:hsl(calc(var(--h) + 42) calc(65% * var(--sm)) 50%);--c3:hsl(calc(var(--h) - 38) calc(60% * var(--sm)) 40%);--c4:hsl(calc(var(--h) + 12) calc(75% * var(--sm)) 62%)}

[data-bg=rose]{--c0:#1d1018;--c1:#ff6fa3;--c2:#ff9a6b;--c3:#b04ae0;--c4:#ffc2d6}

/* themed presets: tuned so the matching falling particles stay readable */
[data-bg=cherry]{--c0:#1f0f18;--c1:#e0629a;--c2:#b8467f;--c3:#6e2a6a;--c4:#f2a0c0}
[data-bg=snow]{--c0:#0b1424;--c1:#3f7fd0;--c2:#2f5fae;--c3:#1d3a78;--c4:#8cc4f2}

/* custom uploaded panorama: slowly scrolls sideways like the Minecraft menu */
.pano{position:absolute;inset:0;display:none;background-image:var(--pano);background-repeat:repeat-x;background-position:0 50%;background-size:var(--tw,auto) var(--th,100%);animation:pan var(--pd,160s) linear infinite;will-change:background-position}
[data-bg=custom] .pano{display:block}
[data-bg=custom] .ios{display:none}
@keyframes pan{to{background-position:calc(var(--tw,0px) * -1) 50%}}
/* vanilla-style panorama: camera in the middle of a cube, spinning a full 360 degrees with a gentle up/down sway */
.cubewrap{position:absolute;inset:0;display:none;overflow:hidden;perspective:var(--cp,600px)}
[data-bg=cube] .cubewrap{display:block}
[data-bg=cube] .ios,[data-bg=cube] .pano{display:none}
.cubepos,.cubepitch,.cube{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.cubepos{transform:translateZ(var(--cp,600px))}
.cubepitch{animation:cpitch 24s ease-in-out infinite alternate}
.cube{animation:cyaw 100s linear infinite}
.cube i{position:absolute;left:-512px;top:-512px;width:1024px;height:1024px;background-size:100% 100%;image-rendering:pixelated;backface-visibility:hidden}
.cf0{transform:translateZ(-511px)}
.cf1{transform:rotateY(-90deg) translateZ(-511px)}
.cf2{transform:rotateY(180deg) translateZ(-511px)}
.cf3{transform:rotateY(90deg) translateZ(-511px)}
.cf4{transform:rotateX(-90deg) translateZ(-511px)}
.cf5{transform:rotateX(90deg) translateZ(-511px)}
@keyframes cyaw{to{transform:rotateY(360deg)}}
@keyframes cpitch{from{transform:rotateX(-7deg)}to{transform:rotateX(9deg)}}

.mcw{position:relative;width:44px;height:44px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.08)}
.mcw img{display:block;width:100%;height:100%;object-fit:cover}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding:11px 13px;background:rgba(0,0,0,.5)}
.mlist.playing .now .eq{display:flex}
.eq i{width:4px;height:30%;border-radius:2px;background:var(--ac);animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.55s}
@keyframes eq{to{height:100%}}
.mi{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.mi b,.mi small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi small{color:var(--dim);font-size:12.5px}
.mt.now .mi b{color:hsl(var(--h) calc(85% * var(--sm)) 80%)}
.mt .ms{font-size:11.5px;color:var(--dim);padding:2px 9px;border:1px solid var(--line);border-radius:99px;white-space:nowrap}
.mt em{font-style:normal;color:var(--dim);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}

/* player: fixed, bottom centre */
.mp{position:fixed;left:0;right:0;margin:0 auto;bottom:22px;z-index:30;width:min(480px,calc(100vw - 24px));padding:9px 14px 8px 9px;border-radius:26px;container-type:inline-size;box-shadow:0 20px 44px -14px rgba(0,0,0,.6);
 opacity:0;translate:0 40px;pointer-events:none;transition:opacity .3s,translate .45s cubic-bezier(.3,1.2,.5,1)}
.mp.has{opacity:1;translate:0 0;pointer-events:auto}
.mp-row{display:flex;align-items:center;gap:12px}
.mp-cover{position:relative;flex:none;width:48px;height:48px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.08);cursor:default}
.mp.yt .mp-cover{cursor:pointer}
.mp-cover img{display:block;width:100%;height:100%;object-fit:cover}
.mp-cover img[hidden]{display:none}
.mp-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.28}
.mp-info b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-info span{color:var(--dim);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp.err .mp-info span{color:#ffa3a3}
.mp-ctl{display:flex;align-items:center;gap:4px}
.mp-b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--ink);transition:background .2s,transform .15s,opacity .2s}
.mp-b:not(.drop):hover{background:rgba(255,255,255,.1)}
.mp-b:active{transform:scale(.92)}
.mp-b:disabled{opacity:.35;pointer-events:none}
.mp-b svg{width:20px;height:20px;fill:currentColor;stroke:none}
.mp-main{width:46px;height:46px}
.mp-main svg{width:22px;height:22px}
.mp-main .i-pause,.mp-main.is-play .i-play{display:none}
.mp-main.is-play .i-pause{display:block}
.mp-vol{display:flex;align-items:center;gap:2px}
.mp-vol input{width:76px}
.mp-vol .i-off,.mp-vol.muted .i-on{display:none}
.mp-vol.muted .i-off{display:block}
.mp-seek{display:flex;align-items:center;gap:10px;margin:5px 6px 0 6px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.mp-seek span{min-width:34px}
.mp-seek span:last-child{text-align:right}
.mp-bar{position:relative;flex:1;height:16px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.mp-bar::before{content:"";position:absolute;left:0;right:0;height:5px;border-radius:5px;background:rgba(255,255,255,.14);transition:height .15s}
.mp-bar i{position:relative;display:block;height:5px;width:0;border-radius:5px;background:var(--ac);transition:height .15s}
.mp-bar:hover::before,.mp-bar:hover i{height:7px}
.mp-vid{position:absolute;left:50%;bottom:calc(100% + 12px);translate:-50% 14px;width:356px;max-width:calc(100vw - 40px);aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:0 20px 44px -14px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .2s,translate .3s cubic-bezier(.3,1.2,.5,1)}
.mp-vid.open{opacity:1;pointer-events:auto;translate:-50% 0}
.mp-vid iframe{display:block;width:100%;height:100%;border:0}
@container (max-width:470px){.mp-vol{display:none}}
.conn{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-size:13px;flex:none}
.conn[hidden]{display:none}
.conn h4{font-size:14px;font-weight:650}
.conn ol{padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--dim);line-height:1.45}
.conn ol b{color:var(--ink);font-weight:600}
.conn .cr{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.conn .vs{width:min(260px,100%);flex:1 1 200px}
a.btn{display:inline-block;text-decoration:none;color:var(--ink)}

/* ================= live wallpapers (video / GIF / animated WebP) ================= */
.live{position:absolute;inset:0;display:none;overflow:hidden;background:#0b0910}
[data-bg=live] .live{display:block}
[data-bg=live] .ios,[data-bg=live] .pano,[data-bg=live] .cubewrap{display:none}
.live video,.live img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.live [hidden]{display:none!important}
.live::after{content:"";position:absolute;inset:0;background:rgba(8,6,14,var(--vd,.1))}
[data-bg=live] #fxBack{z-index:1}
.f.live-only{display:none}
[data-bg=live] .f.live-only{display:grid}
.lrow{display:flex;gap:8px;flex-wrap:wrap}
.pv-live{position:relative;background-size:cover}
.pv-live::after{content:"";position:absolute;right:5px;bottom:5px;width:0;height:0;border-left:7px solid #fff;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.pv-addlive{position:relative;font-size:0}
.pv-addlive::before{content:"";position:absolute;left:50%;top:50%;translate:-30% -50%;width:0;height:0;border-left:11px solid var(--dim);border-top:7px solid transparent;border-bottom:7px solid transparent}

/* drop hint */
.drophint{position:fixed;inset:14px;z-index:70;display:grid;place-items:center;border-radius:30px;border:2px dashed rgba(255,255,255,.42);background:rgba(20,16,28,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:20px;font-weight:650;letter-spacing:-.01em;opacity:0;pointer-events:none;transition:opacity .18s}
.dropping .drophint{opacity:1}

/* guide sheet */
.guide{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(10,8,16,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .22s,visibility 0s .22s}
.guide.open{opacity:1;visibility:visible;transition:opacity .22s}
.gcard{position:relative;width:min(680px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:26px;padding:32px 36px 30px;background:rgba(28,24,36,.95);border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.75);scale:.96;translate:0 12px;transition:scale .3s cubic-bezier(.3,1.2,.5,1),translate .3s cubic-bezier(.3,1.2,.5,1);user-select:text}
.guide.open .gcard{scale:1;translate:0 0}
.gx{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--dim);transition:color .2s,background .2s}
.gx:hover{color:var(--ink);background:rgba(255,255,255,.1)}
.gx svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.gcard h3{font-size:26px;font-weight:700;letter-spacing:-.025em;padding-right:40px}
.gsub{color:var(--dim);margin:6px 0 24px;max-width:52ch;line-height:1.5}
.gsteps{list-style:none;padding:0;display:flex;flex-direction:column}
.gsteps li{display:grid;grid-template-columns:44px 1fr;gap:6px 14px;padding:15px 0;border-top:1px solid var(--line)}
.gsteps li:first-child{border-top:0;padding-top:4px}
.gn{font-size:30px;font-weight:300;line-height:1;color:var(--ac);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.gsteps b{display:block;font-size:15px;margin-bottom:3px}
.gsteps p{color:var(--dim);line-height:1.5}
.gsteps p em,.gtr dd em{font-style:normal;color:var(--ink)}
.gcard h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600;margin:26px 0 8px}
.gcard>p{color:var(--dim);line-height:1.5}
.gcode{position:relative;margin:12px 0 0;padding:14px 92px 14px 16px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.gcode code{display:block;font:12.5px/1.55 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--ink);white-space:pre-wrap;word-break:break-word;background:none;padding:0}
.gcode .btn{position:absolute;top:10px;right:10px;padding:6px 11px;font-size:12px}
.gtr{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:0 18px}
.gtr dt,.gtr dd{padding:11px 0;border-top:1px solid var(--line)}
.gtr dt:first-of-type,.gtr dt:first-of-type+dd{border-top:0}
.gtr dt{font-weight:600}
.gtr dd{color:var(--dim);line-height:1.5}
@media (max-width:620px){.gcard{padding:26px 22px}.gtr{grid-template-columns:1fr}.gtr dd{border-top:0;padding-top:0}}
</style>

/* ---- liquid lens ---- */
const nav=$('#nav'), lens=$('#lens'), tabs=$$('#nav button[data-tab]');
let cur=0, first=true;
function moveLens(i){
  const b=tabs[i];
  lens.style.height=b.offsetHeight+'px';
  lens.style.translate='0 '+b.offsetTop+'px';
  if(!first&&i!==cur&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
    lens.animate([
      {scale:'1 1',easing:'ease-out'},
      {scale:'.985 1.05',offset:.4,easing:'ease-in-out'},
      {scale:'1 1'}
    ],{duration:420});
  }
  first=false;
}
/* slight liquid ripple on page change: peaks small, always returns to a clean (filter-free) page */
let liqRaf=0,liqEl=null;
function liquid(el,peak=9,ms=520){
  if(!S.rip||!el||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  cancelAnimationFrame(liqRaf);
  if(liqEl)liqEl.style.filter='';
  liqEl=el;el.style.filter='url(#liq)';
  const dm=$('#dm'),t0=performance.now();
  (function step(now){
    const k=Math.min((now-t0)/ms,1),e=(1-k)*(1-k);
    dm.setAttribute('scale',(peak*e).toFixed(2));
    if(k<1)liqRaf=requestAnimationFrame(step);
    else{el.style.filter='';dm.setAttribute('scale',0);liqEl=null}
  })(t0);
}
function pick(i){
  setSettings(false);
  if(i===cur&&!first)return;

function exObj(){

  const g=cv.getContext('2d'),sk=g.createLinearGradient(0,0,0,H);
  sk.addColorStop(0,'#2a2058');sk.addColorStop(.55,'#b04a8a');sk.addColorStop(1,'#ffb36b');
  g.fillStyle=sk;g.fillRect(0,0,W,H);
  g.fillStyle='#fff';for(let i=0;i<110;i++){g.globalAlpha=.25+Math.random()*.6;g.fillRect(Math.random()*W,Math.random()*H*.45,2,2)}
  g.globalAlpha=1;g.fillStyle='rgba(255,236,200,.95)';g.beginPath();g.arc(W*.62,H*.58,48,0,7);g.fill();
  [['#6b3a8c',.68,46,5,0],['#43266b',.8,56,9,1.7],['#241447',.92,40,14,3.1]].forEach(([c,b,a,k,p])=>{
    g.fillStyle=c;g.beginPath();g.moveTo(0,H);
    for(let x=0;x<=W;x+=8){const s=x/W*Math.PI*2;g.lineTo(x,H*b-a*Math.abs(Math.sin(k*s/2+p))-a*.4*Math.sin(k*2*s+p))}

}

/* ---- article for the selected version ----
   Official patch notes (text + images) come from Mojang's own launcher feed, so every version
   Mojang writes notes for - including future ones - gets its article automatically. */
const CBASE='https://launchercontent.mojang.com/';
const FEEDS=[CBASE+'v2/javaPatchNotes.json',CBASE+'javaPatchNotes.json'];
/* in Electron, expose api.fetchJson(url) from the main process if the page cannot fetch these URLs directly */
const J=u=>(window.api&&window.api.fetchJson)?window.api.fetchJson(u):fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()});
let PN={},BODY={},artTok=0;
try{PN=JSON.parse(localStorage.getItem('gc-pn')||'{}')}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const abs=u=>{try{const x=new URL(u,CBASE);return /^https?:$/.test(x.protocol)?x.href:null}catch(e){return null}};
const imgOf=i=>!i?null:typeof i==='string'?i:(i.url||null);
function keyOf(e){
  const s=String(e.version||e.title||'').replace(/\s*Pre-Release\s*/i,'-pre').replace(/\s*Release Candidate\s*/i,'-rc');
  const m=s.match(/\d\d?w\d\d[a-z]|\d+\.\d+(?:\.\d+)?(?:-(?:pre|rc)\d+)?/i);
  return m?m[0].toLowerCase():null;
}
async function loadNotes(){
  let d=null;
  for(const u of FEEDS){try{d=await J(u);if(d&&Array.isArray(d.entries))break}catch(e){}}
  if(!d||!Array.isArray(d.entries))return;
  const idx={};
  for(const e of d.entries){
    const k=keyOf(e);if(!k||idx[k])continue;
    idx[k]={title:e.title||'',type:e.type||'',date:String(e.date||'').slice(0,10),img:imgOf(e.image),alt:(e.image&&e.image.title)||'',path:e.contentPath||''};
    if(typeof e.body==='string'&&e.body)BODY[k]=e.body;
  }
  PN=idx;
  try{localStorage.setItem('gc-pn',JSON.stringify(idx))}catch(e){}
  renderArt();

async function getBody(k){
  if(BODY[k]!==undefined)return BODY[k];
  const n=PN[k],u=n&&n.path?abs(n.path):null;
  if(!u)return null;
  try{const j=await J(u);BODY[k]=typeof j==='string'?j:(j&&j.body)||null}catch(e){BODY[k]=null}

function cleanHtml(html){
  const d=new DOMParser().parseFromString(String(html),'text/html');
  const OK='H1 H2 H3 H4 H5 P UL OL LI B STRONG I EM CODE PRE BR A IMG HR TABLE THEAD TBODY TR TH TD SPAN DIV BLOCKQUOTE DETAILS SUMMARY SUP SUB FIGURE FIGCAPTION'.split(' ');
  const BAD=/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META|FORM|INPUT|BUTTON|SVG|VIDEO|AUDIO|SOURCE|NOSCRIPT)$/;
  (function walk(n){
    for(const c of [...n.children]){
      if(BAD.test(c.tagName)){c.remove();continue}
      walk(c);
      if(!OK.includes(c.tagName)){c.replaceWith(...c.childNodes);continue}
      for(const a of [...c.attributes]){
        const k=a.name.toLowerCase();
        if(k==='href'&&c.tagName==='A'){const u=abs(a.value);u?c.setAttribute('href',u):c.removeAttribute('href')}
        else if(k==='src'&&c.tagName==='IMG'){const u=abs(a.value);if(u)c.setAttribute('src',u);else{c.remove();break}}
        else if(k!=='alt'&&k!=='title')c.removeAttribute(a.name);
      }
      if(c.tagName==='A'){c.setAttribute('target','_blank');c.setAttribute('rel','noopener noreferrer')}
      if(c.tagName==='IMG'){c.setAttribute('loading','lazy');c.setAttribute('referrerpolicy','no-referrer');c.setAttribute('onerror','this.remove()')}
    }
  })(d.body);
  return d.body.innerHTML;
}

  if(type==='old_beta'&&/^b/.test(id))return 'https://minecraft.wiki/w/Java_Edition_Beta_'+E(id.slice(1));
  if(type==='old_alpha'&&/^a/.test(id))return 'https://minecraft.wiki/w/Java_Edition_Alpha_v'+E(id.slice(1));
  if(type==='release'||type==='snapshot')return 'https://minecraft.wiki/w/Java_Edition_'+E(id);
  return 'https://minecraft.wiki/w/Special:Search?search='+E(id);
}

  for(let y=0;y<h;y++){const t=(y+.5)/h,cx=cxAt(t),hw=hwAt(t);
    for(let x=0;x<W;x++)if(Math.abs(x+.5-cx)<=hw)g[y][x]='m';}
  const filled=(x,y)=>x>=0&&y>=0&&x<W&&y<h&&g[y][x]!=='.';
  const edge=g.map((r,y)=>r.map((c,x)=>c!=='.'&&!(filled(x-1,y)&&filled(x+1,y)&&filled(x,y-1)&&filled(x,y+1))));

    for(let x=0;x<W;x++){if(g[y][x]==='.')continue;

function snowSprite(kind){

      g.lineWidth=2.2;

    const R=27,Ls=[[0,1.04,.5],[1,.92,.5],[-1,.92,.5],[2.15,.68,.46],[-2.15,.68,.46]];
    const er=a=>{let m=.42;for(const[c0,len,w]of Ls){const d=Math.abs(Math.atan2(Math.sin(a-c0),Math.cos(a-c0)));if(d<w)m=Math.max(m,len*Math.pow(1-d/w,.55))}return m*R};

function fxBuild(){
  P=[];const type=S.fx;if(type==='off')return;

    P.push({front,d,snow,sc:snow?(front?rnd(.3,.46):rnd(.12,.24)):(front?(d>.92?4:3):2)+(type==='cherry'?1:0),spr:SPR[type][Math.random()*SPR[type].length|0],

      amp:(snow?rnd(6,16):rnd(18,46))*(.6+d*.8),fq:rnd(.6,1.4),ph:rnd(0,6.28),drift:rnd(4,16)*(.5+d),

function fxFrame(now){
  const dt=Math.min((now-fxLast)/1000||0,.05);fxLast=now;
  bg2.clearRect(0,0,W,H);fg2.clearRect(0,0,W,H);
  const wind=Math.sin(now/4000)*18,step=Math.PI/8;
  for(const p of P){
    p.y+=p.vy*dt;p.x+=(p.drift+wind*(.4+p.d))*dt;p.ph+=p.fq*dt;p.fp+=p.fl*dt;p.rot+=p.rs*dt;

async function getJ(u){
  if(window.api&&window.api.fetchJson)return window.api.fetchJson(u);
  const r=await Promise.race([fetch(u),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),12000))]);
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error((d&&d.error&&(d.error.message||d.error))||('HTTP '+r.status));

}

}
function markRows(){
  const c=trKey(now());
  $$('#mlist .mt').forEach(b=>b.classList.toggle('now',!!c&&trKey(LIST[+b.dataset.k])===c));
  $('#mlist').classList.toggle('playing',PL.playing);
}
const setNote=m=>{const n=$('#mnote');n.textContent=m||'';n.hidden=!m};

/* ---------- connect guide (YouTube key / Yandex token) ---------- */
const CONN={
  yt:{p:'cn_yt',n:3,btns:[['cn_yt_b1','https://console.cloud.google.com/apis/library/youtube.googleapis.com'],['cn_yt_b2','https://console.cloud.google.com/apis/credentials']],
      has:hasYt,parse:v=>{const m=v.match(/[?&]key=([\w-]+)/);return m?m[1]:v},set:v=>{S.ytk=v}},
  ym:{p:'cn_ym',n:3,btns:[['cn_ym_b1','https://oauth.yandex.ru/authorize?response_type=token&client_id=23cabbbdc6cd418abb4b39c32c41195d']],
      has:hasYm,parse:v=>{const m=v.match(/access_token=([^&\s]+)/);return m?m[1]:v},set:v=>{S.ymt=v}}
};
let connFor=null;
function renderConn(){
  const c=CONN[connFor];$('#conn').hidden=!c;if(!c)return;
  $('#connT').textContent=t(c.p+'_t');
  $('#connSteps').innerHTML=Array.from({length:c.n},(_,i)=>`<li>${t(c.p+'_'+(i+1))}</li>`).join('');
  $('#connBtns').innerHTML=c.btns.map(([k,u])=>`<a class="btn" href="${u}" target="_blank" rel="noopener noreferrer">${esc(t(k))}</a>`).join('');
  $('#connIn').placeholder=t('cn_ph');
}
const showConn=k=>{connFor=k||null;renderConn()};
$('#connSave').addEventListener('click',()=>{
  const c=CONN[connFor],v=$('#connIn').value.trim();if(!c||!v)return;
  c.set(c.parse(v));$('#connIn').value='';save();showConn(null);
  if($('#mq').value.trim())doSearch();
});
$('#connIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#connSave').click()});

async function doSearch(){
  clearTimeout(dt);
  const q=$('#mq').value.trim(),tok=++mTok;
  setNote('');
  if(!q){LIST=[];renderList('hint');return}
  renderList('load');
  const link=await fromLink(q);if(tok!==mTok)return;
  if(link){LIST=link;renderList();return}
  const keys=mSrc==='all'?['yt','ym']:[mSrc];
  const res=await Promise.allSettled(keys.map(k=>SRCS[k](q)));
  if(tok!==mTok)return;
  const ok=[],bad=[];let need=null;
  res.forEach((r,i)=>{
    if(r.status==='fulfilled'){ok.push(r.value);return}
    const e=r.reason||{},k=keys[i];
    if(!need&&!e.noapi&&(e.nokey||e.auth||k==='yt'))need=k;   /* missing or rejected credentials: show the guide */
    if(e.nokey&&keys.length>1)return;                         /* silently skipped in "All" */
    bad.push(SRCN[k]+(e.message&&!e.nokey?' ('+e.message+')':''));
  });
  /* round-robin so the top hit of every source is visible at once */
  const out=[];for(let i=0;ok.some(a=>i<a.length);i++)ok.forEach(a=>{if(i<a.length)out.push(a[i])});
  LIST=out;
  setNote(bad.length?t('ms_fail')+bad.join(', '):'');
  showConn(need);
  $('#mlist').scrollTop=0;
  renderList();
}
$('#mq').addEventListener('input',()=>{clearTimeout(dt);dt=setTimeout(doSearch,450)});
$('#mq').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
$('#msrc').addEventListener('click',e=>{
  const b=e.target.closest('[data-src]');if(!b)return;
  mSrc=b.dataset.src;$$('#msrc button').forEach(x=>x.classList.toggle('on',x===b));
  showConn(CONN[mSrc]&&!CONN[mSrc].has()?mSrc:null);
  if($('#mq').value.trim())doSearch();
});
tabs.find(b=>b.dataset.tab==='music').addEventListener('click',()=>setTimeout(()=>$('#mq').focus({preventScroll:true}),60));

/* ---------- player ---------- */
const PL={q:[],i:-1,playing:false,tok:0,yt:null,ytReady:false,pend:null,poll:0};
const au=new Audio();au.preload='auto';
const mp=$('#mp'),mpVid=$('#mpVid'),now=()=>PL.q[PL.i]||null;
let seeking=false;

function setPlaying(v){
  PL.playing=v;
  $('#mpPlay').classList.toggle('is-play',v);
  $('#mlist').classList.toggle('playing',v);
  if('mediaSession' in navigator)navigator.mediaSession.playbackState=v?'playing':'paused';
  clearInterval(PL.poll);
  if(v&&now()&&now().src==='yt')PL.poll=setInterval(()=>{
    if(!PL.ytReady)return;
    try{updProg(PL.yt.getCurrentTime(),PL.yt.getDuration())}catch(e){}
  },250);
}
function updProg(c,d){
  if(seeking)return;
  $('#mpCur').textContent=fmt(c);$('#mpDur').textContent=d?fmt(d):'--:--';
  $('#mpFill').style.width=(d?Math.min(100,c/d*100):0)+'%';
  $('#mpBar').setAttribute('aria-valuenow',d?Math.round(c/d*100):0);
}
function setIdle(){
  mp.classList.add('idle');mp.classList.remove('yt','err','has');document.documentElement.classList.remove('hasmp');
  $('#mpTitle').textContent=t('ms_idle');$('#mpArtist').textContent=t('ms_idle2');
  $('#mpImg').hidden=true;
  ['#mpPrev','#mpPlay','#mpNext'].forEach(q=>$(q).disabled=true);
  updProg(0,0);
}
function setMeta(tr){
  mp.classList.remove('idle','err');mp.classList.toggle('yt',tr.src==='yt');
  mp.classList.add('has');document.documentElement.classList.add('hasmp');
  if(tr.src!=='yt')openVid(false);
  $('#mpTitle').textContent=tr.title;
  $('#mpArtist').textContent=tr.artist||'';
  const im=$('#mpImg');
  if(tr.cover){im.hidden=false;im.src=tr.cover;im.onerror=()=>{im.hidden=true}}else{im.hidden=true;im.removeAttribute('src')}
  ['#mpPrev','#mpPlay','#mpNext'].forEach(q=>$(q).disabled=false);
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:tr.title,artist:tr.artist||'',artwork:tr.cover?[{src:tr.cover}]:[]})}catch(e){}}
}
function fail(msg){
  setPlaying(false);mp.classList.add('err');$('#mpArtist').textContent=msg;
}
function openVid(v){mpVid.classList.toggle('open',v);$('#mpCover').setAttribute('aria-expanded',v)}

/* YouTube IFrame API, loaded on first use */
let ytApi=null;
function ytLoadApi(){
  if(window.YT&&window.YT.Player)return Promise.resolve();
  return ytApi||(ytApi=new Promise((res,rej)=>{
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{if(prev)prev();res()};
    const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';
    sc.onerror=()=>{ytApi=null;rej({msg:t('ms_ytnet')})};
    document.head.appendChild(sc);
  }));
}
async function ytPlay(id,tok){
  await ytLoadApi();
  if(tok!==PL.tok)return;
  PL.pend=id;
  if(PL.yt){if(PL.ytReady)PL.yt.loadVideoById(id);return}   /* created but not ready yet: onReady loads PL.pend */
  const vars={autoplay:1,controls:0,disablekb:1,fs:0,rel:0,playsinline:1,modestbranding:1};
  if(/^https?:/.test(location.protocol))vars.origin=location.origin;
  PL.yt=new YT.Player('ytmount',{width:'100%',height:'100%',playerVars:vars,events:{
    onReady:()=>{PL.ytReady=true;applyVol();if(PL.pend)PL.yt.loadVideoById(PL.pend)},
    onStateChange:e=>{
      const c=now();if(!c||c.src!=='yt')return;
      if(e.data===1)setPlaying(true);
      else if(e.data===2)setPlaying(false);
      else if(e.data===0){setPlaying(false);next(true)}
    },
    onError:e=>{
      const c=e.data;
      fail(c===153?t('ms_yt153'):(c===100||c===101||c===150)?t('ms_ytno'):t('ms_err'));
    }
  }});
}
function ytStop(){PL.pend=null;if(PL.ytReady){try{PL.yt.stopVideo()}catch(e){}}}

async function playIdx(i){
  const tr=PL.q[i];if(!tr)return;
  PL.i=i;const tok=++PL.tok;
  setMeta(tr);markRows();updProg(0,tr.dur||0);
  try{
    if(tr.src==='yt'){au.pause();await ytPlay(tr.id,tok)}
    else{
      ytStop();
      let url=tr.url;
      if(tr.src==='ym'){
        $('#mpArtist').textContent='…';
        url=await window.api.yandexStream(tr.id,S.ymt);
        if(tok!==PL.tok)return;
        $('#mpArtist').textContent=tr.artist||'';
      }
      au.src=url;await au.play();
    }
  }catch(e){
    if(tok!==PL.tok||(e&&e.name==='AbortError'))return;
    fail((e&&e.msg)||t('ms_err'));
  }
}
function toggle(){
  const tr=now();if(!tr)return;
  if(tr.src==='yt'){if(!PL.ytReady)return;PL.playing?PL.yt.pauseVideo():PL.yt.playVideo()}
  else au.paused?au.play().catch(()=>{}):au.pause();
}
function next(auto){
  if(PL.i<0)return;
  if(PL.i+1<PL.q.length)playIdx(PL.i+1);
  else if(auto){setPlaying(false);const c=now();updProg(0,c?c.dur:0)}
}
const curTime=()=>{const c=now();if(!c)return 0;if(c.src==='yt')return PL.ytReady?PL.yt.getCurrentTime():0;return au.currentTime};
function seekSec(s){
  const c=now();if(!c)return;
  if(c.src==='yt'){if(PL.ytReady)PL.yt.seekTo(Math.max(0,s),true)}
  else au.currentTime=Math.max(0,s);
}
function durNow(){const c=now();if(!c)return 0;if(c.src==='yt')return PL.ytReady?PL.yt.getDuration():0;return isFinite(au.duration)?au.duration:(c.dur||0)}
function prev(){
  if(PL.i<0)return;
  if(curTime()>3||PL.i===0)seekSec(0);else playIdx(PL.i-1);
}

/* html5 audio events (YouTube has its own state callback) */
const isAu=()=>{const c=now();return c&&c.src!=='yt'};
au.addEventListener('timeupdate',()=>{if(isAu())updProg(au.currentTime,durNow())});
au.addEventListener('loadedmetadata',()=>{if(isAu())updProg(au.currentTime,durNow())});
au.addEventListener('play',()=>{if(isAu())setPlaying(true)});
au.addEventListener('pause',()=>{if(isAu()&&!au.ended)setPlaying(false)});
au.addEventListener('ended',()=>{if(isAu()){setPlaying(false);next(true)}});
au.addEventListener('error',()=>{if(isAu()&&au.getAttribute('src'))fail(t('ms_err'))});

/* seek bar */
const bar=$('#mpBar');
const frac=e=>{const r=bar.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))};
bar.addEventListener('pointerdown',e=>{if(!now())return;seeking=true;bar.setPointerCapture(e.pointerId);$('#mpFill').style.width=frac(e)*100+'%'});
bar.addEventListener('pointermove',e=>{if(seeking)$('#mpFill').style.width=frac(e)*100+'%'});
bar.addEventListener('pointerup',e=>{if(!seeking)return;seeking=false;const d=durNow();if(d)seekSec(frac(e)*d)});
bar.addEventListener('pointercancel',()=>{seeking=false});
bar.addEventListener('keydown',e=>{
  if(!now())return;
  if(e.key==='ArrowRight'){seekSec(curTime()+5);e.preventDefault()}
  else if(e.key==='ArrowLeft'){seekSec(curTime()-5);e.preventDefault()}
});

/* volume */
function applyVol(){
  const v=S.mute?0:vol();
  au.volume=v;
  if(PL.ytReady){try{PL.yt.setVolume(Math.round(v*100))}catch(e){}}
  $('#mpVol').value=vol();$('#mpVolBox').classList.toggle('muted',!!S.mute||vol()===0);
}
$('#mpVol').addEventListener('input',e=>{S.vol=+e.target.value;S.mute=false;applyVol()});
$('#mpVol').addEventListener('change',save);
$('#mpMute').addEventListener('click',()=>{S.mute=!S.mute;applyVol();save()});

/* buttons */
$('#mpPlay').addEventListener('click',toggle);
$('#mpNext').addEventListener('click',()=>next());
$('#mpPrev').addEventListener('click',prev);
$('#mpCover').addEventListener('click',()=>{const c=now();if(c&&c.src==='yt')openVid(!mpVid.classList.contains('open'))});
$('#mlist').addEventListener('click',e=>{
  const b=e.target.closest('[data-k]');if(!b)return;
  const i=+b.dataset.k,tr=LIST[i];
  if(trKey(tr)===trKey(now())&&PL.q.length){toggle();return}
  PL.q=LIST.slice();playIdx(i);
});
if('mediaSession' in navigator){
  [['play',()=>{if(!PL.playing)toggle()}],['pause',()=>{if(PL.playing)toggle()}],['previoustrack',prev],['nexttrack',()=>next()]]
    .forEach(([a,f])=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}});
}

/* i18n */
window.musicLang=()=>{
  $('#mq').placeholder=t('ms_ph');renderConn();
  $('#mpPrev').title=t('ms_prev');$('#mpNext').title=t('ms_next');$('#mpPlay').title=t('ms_play');
  $('#mpMute').title=t('ms_vol');$('#mpCover').title=t('ms_video');
  if(!now()){$('#mpTitle').textContent=t('ms_idle');$('#mpArtist').textContent=t('ms_idle2')}
  renderList();
};

setIdle();applyVol();
slider($('#msrc'),'button','on');
/* nav buttons change height on short windows: keep the liquid lens on the active tab */
addEventListener('resize',()=>moveLens(cur));
})();

/* ---- i18n ---- */
function applyLang(){
  document.documentElement.lang=S.lang;
  $$('[data-i]').forEach(n=>n.textContent=t(n.dataset.i));
  tabs.forEach(b=>b.title=t(b.dataset.tab));

ram.value=S.ram;fxn.value=S.fxn;$('#fxnOut').textContent=S.fxn;fxMark();fxResize();fxApply();applyHue();applyFx();renderBgs();renderVer();applyLang();loadCus();loadVers();loadNotes();
/* ---- the same liquid-glass lens for every group of choices ---- */
function slider(box,sel,act){
  const L=document.createElement('i');L.className='gl';box.style.position='relative';box.prepend(L);glassify(L,6);
  let px=null,py=null,shown=false,rt=0;L.style.opacity=0;
  const sync=anim=>{
    if(!L.isConnected)box.prepend(L);
    const it=box.querySelector(sel+'.'+act);
    if(!it||!it.offsetWidth){clearTimeout(rt);shown=false;L.style.opacity=0;return}
    const x=it.offsetLeft,y=it.offsetTop;
    if(!shown){shown=true;clearTimeout(rt);rt=setTimeout(()=>{if(shown)L.style.opacity=1},140)}
    L.style.borderRadius=getComputedStyle(it).borderRadius;
    L.style.width=it.offsetWidth+'px';L.style.height=it.offsetHeight+'px';L.style.translate=x+'px '+y+'px';
    if(anim&&px!==null&&(px!==x||py!==y)&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
      const hz=Math.abs(x-px)>=Math.abs(y-py);
      L.animate([{scale:'1 1',easing:'ease-out'},{scale:hz?'1.05 .985':'.985 1.05',offset:.4,easing:'ease-in-out'},{scale:'1 1'}],{duration:420});
    }
    px=x;py=y;
  };
  new MutationObserver(()=>sync(true)).observe(box,{subtree:true,attributes:true,attributeFilter:['class'],childList:true});
  new ResizeObserver(()=>sync(false)).observe(box);
  sync(false);
}
slider($('#stabs'),'button','on');slider($('#seg'),'button','on');slider($('#verList'),'button','sel');slider($('#vfilter'),'button','on');
slider($('#fxs'),'.fxb','on');slider($('#bgs'),'.fxb','on');slider($('#themes'),'.fxb','on');

requestAnimationFrame(()=>{first=true;moveLens(0)});
